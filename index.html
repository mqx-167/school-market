<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>二手交易平台</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f5f1;
        --surface: #ffffff;
        --surface-alt: #fdf0e4;
        --text: #2b211a;
        --dim: #9c8b7a;
        --border: #f3e3d3;
        --accent: #ff6230;
        --accent-start: #ffa63d;
        --accent-grad: linear-gradient(120deg, #ffa63d 0%, #ff6230 100%);
        --accent-grad-soft: linear-gradient(120deg, #ffb35c 0%, #ff7a45 100%);
        --accent-ink: #ffffff;
        --accent-soft: #ffeee1;
        --price: #ff5a1f;
        --olive: #ff7a2e;
        --olive-soft: #ffeee1;
        --olive-text: #bc4c08;
        --danger: #d63a2a;
        --shadow: 0 10px 26px rgba(255, 98, 48, 0.10), 0 2px 8px rgba(43, 33, 26, 0.05);
        --shadow-lift: 0 16px 34px rgba(255, 98, 48, 0.16), 0 4px 12px rgba(43, 33, 26, 0.07);
        --btn-shadow: 0 8px 18px rgba(255, 98, 48, 0.30);
        --radius: 20px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1512;
          --surface: #292019;
          --surface-alt: #372a20;
          --text: #f7efe7;
          --dim: #b3a08e;
          --border: #463629;
          --accent: #ff7a45;
          --accent-start: #ffb35c;
          --accent-grad: linear-gradient(120deg, #ffab4a 0%, #ff6a35 100%);
          --accent-grad-soft: linear-gradient(120deg, #ffb35c 0%, #ff7a45 100%);
          --accent-soft: #453022;
          --price: #ff8a5c;
          --olive: #ffa06e;
          --olive-soft: #453022;
          --olive-text: #ffa06e;
          --danger: #f0836f;
          --shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
          --shadow-lift: 0 16px 34px rgba(0, 0, 0, 0.55);
          --btn-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      img { display: block; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .wrap { max-width: 1120px; margin: 0 auto; padding: 14px 16px 108px; }

      /* ---------- toolbar / market ---------- */
      .toolbar {
        position: sticky; top: 8px; z-index: 20;
        background: var(--accent-grad); border-radius: 22px;
        padding: 14px 14px 12px; box-shadow: var(--btn-shadow);
      }
      .search-row { display: flex; gap: 8px; }
      .search-box {
        flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px;
        background: var(--surface); border: 1px solid transparent;
        border-radius: 999px; padding: 0 15px; height: 44px;
        box-shadow: 0 4px 12px rgba(120, 45, 0, 0.14);
      }
      .search-box svg { flex: none; color: var(--accent); }
      .search-box input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
      .school-btn {
        flex: none; display: inline-flex; align-items: center; gap: 5px; height: 44px;
        border-radius: 999px; border: 1px solid transparent; background: var(--surface);
        padding: 0 14px; font-size: 13px; font-weight: 600; max-width: 40vw;
        box-shadow: 0 4px 12px rgba(120, 45, 0, 0.14);
      }
      .school-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .school-btn.active { color: var(--price); font-weight: 700; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
      .chip {
        border: 1px solid var(--border); background: var(--surface); color: var(--dim);
        border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500;
        transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
      }
      .chip:active { transform: scale(0.96); }
      .chip.active { background: var(--accent-grad); color: #fff; border-color: transparent; font-weight: 700; box-shadow: 0 5px 12px rgba(255, 98, 48, 0.30); }
      .toolbar .chip { border-color: rgba(255, 255, 255, 0.55); }
      .toolbar .chip.active { background: #ffffff; color: var(--price); border-color: #ffffff; box-shadow: 0 5px 12px rgba(120, 45, 0, 0.18); }
      .sort-row { display: flex; align-items: center; gap: 8px; margin-top: 11px; font-size: 13px; color: var(--dim); }
      .toolbar .sort-row { color: rgba(255, 255, 255, 0.92); font-weight: 500; }
      .sort-row select {
        border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
        padding: 5px 10px; font-size: 13px; font-weight: 600;
      }
      .toolbar .sort-row select { border-color: transparent; box-shadow: 0 3px 9px rgba(120, 45, 0, 0.12); }
      .count-note { margin-left: auto; }

      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
      @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
      @media (min-width: 980px) { .grid { grid-template-columns: repeat(4, 1fr); } }
      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        overflow: hidden; text-align: left; padding: 0; width: 100%;
        display: flex; flex-direction: column; align-items: stretch;
        box-shadow: var(--shadow);
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }
      .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
      .card:active { transform: scale(0.985); }
      .card .ph { position: relative; display: block; aspect-ratio: 1 / 1; background: var(--surface-alt); }
      .card .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .card .ph .noimg {
        width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        color: var(--dim); font-size: 13px;
      }
      .sold-mask {
        position: absolute; inset: 0; background: rgba(20, 16, 12, 0.45);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 3px;
      }
      .card .bd { display: block; padding: 12px 13px 13px; }
      .card .ttl {
        font-size: 14px; font-weight: 600; line-height: 1.4; margin: 0 0 6px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        min-height: 2.8em;
      }
      .price { color: var(--price); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
      .price small { font-size: 12px; font-weight: 700; }
      .orig { color: var(--dim); font-size: 12px; text-decoration: line-through; margin-left: 6px; }
      .meta { color: var(--dim); font-size: 12px; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .tag {
        display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
        background: var(--surface-alt); color: var(--dim);
      }
      .tag.olive { background: var(--olive-soft); color: var(--olive-text); }
      .tag.demo { background: var(--accent-soft); color: var(--accent); }
      .fav-heart {
        position: absolute; top: 9px; right: 9px; z-index: 2;
        width: 34px; height: 34px; border-radius: 50%;
        background: var(--surface); border: 1px solid transparent;
        display: flex; align-items: center; justify-content: center;
        color: var(--dim); box-shadow: 0 4px 10px rgba(43, 33, 26, 0.14);
      }
      .fav-heart.on { color: var(--accent); background: var(--accent-soft); }

      .empty {
        text-align: center; color: var(--dim); padding: 56px 20px;
        background: var(--surface); border: 1.5px dashed var(--border); border-radius: var(--radius); margin-top: 14px;
      }
      .empty p { margin: 0 0 14px; }

      /* ---------- bottom nav ---------- */
      .tabbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        background: var(--surface); border-top: 1px solid var(--border);
        box-shadow: 0 -6px 20px rgba(255, 98, 48, 0.07);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .tabbar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: flex-end; }
      .tab {
        flex: 1; background: none; border: 0; padding: 7px 0 8px; position: relative;
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        color: var(--dim); font-size: 12px; font-weight: 500;
        -webkit-tap-highlight-color: transparent;
      }
      .tab .ic {
        display: flex; align-items: center; justify-content: center;
        width: 52px; height: 30px; border-radius: 999px;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .tab:active .ic { transform: scale(0.9); }
      .tab.active { color: var(--price); font-weight: 700; }
      .tab.active .ic { background: var(--accent-soft); }
      .tab .dot {
        position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px;
        background: var(--accent-grad); color: #fff; border-radius: 999px; font-size: 10px;
        display: flex; align-items: center; justify-content: center; padding: 0 5px; font-weight: 700;
        border: 2px solid var(--surface); box-sizing: content-box;
      }
      /* 中间「发布」：凸起的渐变圆钮 */
      .tab.pub { padding-top: 0; }
      .tab.pub .ic {
        width: 54px; height: 54px; border-radius: 50%;
        background: var(--accent-grad); color: #fff;
        margin-top: -26px; margin-bottom: 2px;
        border: 3.5px solid var(--surface);
        box-shadow: 0 10px 22px rgba(255, 98, 48, 0.38), 0 3px 8px rgba(255, 98, 48, 0.25);
      }
      .tab.pub:active .ic { transform: scale(0.92); }
      .tab.pub.active { color: var(--price); }
      .tab.pub.active .ic { background: var(--accent-grad); }

      /* ---------- forms ---------- */
      .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 18px; margin-top: 14px; box-shadow: var(--shadow); }
      .panel h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
      .panel .sub { color: var(--dim); font-size: 13px; margin: 0 0 14px; }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      .field input, .field select, .field textarea {
        width: 100%; border: 1px solid var(--border); background: var(--bg);
        border-radius: 14px; padding: 11px 13px; outline: none;
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .field textarea { min-height: 92px; resize: vertical; }
      .field .hint { font-size: 12px; color: var(--dim); margin-top: 5px; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        background: var(--accent-grad); color: var(--accent-ink); border: 0; border-radius: 999px;
        padding: 12px 20px; font-weight: 700; font-size: 15px;
        box-shadow: var(--btn-shadow);
        transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      }
      .btn:active { transform: scale(0.97); }
      .btn.block { width: 100%; }
      .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); font-weight: 600; box-shadow: none; }
      .btn.olive { background: var(--accent-grad-soft); color: #fff; }
      .btn.danger { background: var(--surface); color: var(--danger); border: 1px solid var(--danger); font-weight: 600; box-shadow: none; }
      .btn.small { padding: 8px 15px; font-size: 13px; border-radius: 999px; }
      .btn[disabled] { opacity: 0.55; cursor: default; }
      .err { color: var(--danger); font-size: 13px; margin: 0 0 12px; }
      .photo-pick {
        display: flex; align-items: center; gap: 12px;
      }
      .photo-pick .pv { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border); background: var(--surface-alt); }
      .photo-pick .pv-none {
        width: 84px; height: 84px; border-radius: 14px; border: 1.5px dashed var(--border);
        display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; text-align: center;
      }
      .picker-field {
        width: 100%; text-align: left; border: 1px solid var(--border); background: var(--bg);
        border-radius: 14px; padding: 11px 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      }
      .picker-field .ph-t { color: var(--dim); }

      /* ---------- overlays ---------- */
      .overlay { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
      .overlay-in { max-width: 780px; margin: 0 auto; padding: 0 0 40px; }
      .topbar {
        position: sticky; top: 0; z-index: 5; background: var(--accent-grad); color: #fff;
        display: flex; align-items: center; gap: 10px; padding: 12px 16px;
        box-shadow: 0 6px 18px rgba(255, 98, 48, 0.22);
      }
      .back-btn {
        border: 1px solid rgba(255, 255, 255, 0.45); background: rgba(255, 255, 255, 0.22); color: #fff; border-radius: 999px;
        width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex: none;
      }
      .overlay .back-btn { border-color: rgba(255, 255, 255, 0.45); background: rgba(255, 255, 255, 0.22); color: #fff; }
      .topbar .tt { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .detail-hero { position: relative; background: var(--surface-alt); }
      .detail-hero img { width: 100%; max-height: 52vh; object-fit: cover; }
      .detail-hero .noimg { height: 220px; display: flex; align-items: center; justify-content: center; color: var(--dim); }
      .detail-bd { padding: 16px; }
      .detail-bd h1 { font-size: 20px; margin: 8px 0 6px; line-height: 1.35; }
      .detail-price { font-size: 26px; }
      .desc { white-space: pre-wrap; margin: 12px 0 0; font-size: 15px; }
      .seller-row {
        display: flex; align-items: center; gap: 10px; background: var(--surface);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; margin-top: 16px;
        box-shadow: var(--shadow);
      }
      .avatar {
        width: 40px; height: 40px; border-radius: 50%; background: var(--accent-grad); color: #fff;
        display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex: none;
      }
      .seller-row .nm { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .seller-row .sc { color: var(--dim); font-size: 12px; }
      .action-row { display: flex; gap: 10px; margin-top: 14px; }
      .action-row .btn { flex: 1; }
      .sec-ttl { font-size: 17px; font-weight: 800; margin: 24px 0 10px; }
      .comment { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 9px; }
      .comment .hd { display: flex; align-items: center; gap: 7px; font-size: 13px; }
      .comment .hd .who { font-weight: 700; }
      .comment .hd .when { color: var(--dim); font-size: 12px; margin-left: auto; }
      .comment .tx { margin: 5px 0 0; font-size: 14px; }
      .comment-input { display: flex; gap: 8px; margin-top: 12px; }
      .comment-input input { flex: 1; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 10px 15px; outline: none; min-width: 0; }
      .note-box {
        background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; font-size: 13px; margin-top: 16px;
      }

      /* ---------- chat ---------- */
      .chat-wrap { display: flex; flex-direction: column; height: 100dvh; max-width: 780px; margin: 0 auto; }
      .chat-head { padding: 12px 16px; background: var(--accent-grad); color: #fff; box-shadow: 0 6px 18px rgba(255, 98, 48, 0.22); }
      .chat-item-line { display: flex; gap: 10px; align-items: center; margin-top: 10px; background: var(--surface); color: var(--text); border: 1px solid transparent; border-radius: 14px; padding: 8px; text-align: left; width: 100%; box-shadow: 0 4px 12px rgba(120, 45, 0, 0.14); }
      .chat-item-line img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-alt); }
      .chat-item-line .t { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .bubble { max-width: 76%; padding: 10px 14px; border-radius: 19px; font-size: 14px; line-height: 1.5; word-break: break-word; }
      .bubble.me { align-self: flex-end; background: var(--accent-grad); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 5px 14px rgba(255, 98, 48, 0.25); }
      .bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
      .bubble .rd { display: block; font-size: 10px; opacity: 0.75; margin-top: 3px; text-align: right; }
      .bubble-img { max-width: 220px; width: 100%; border-radius: 12px; display: block; }
      .bubble-video { max-width: 260px; width: 100%; border-radius: 12px; display: block; background: #000; }
      .chat-status { padding: 6px 16px; font-size: 12px; color: var(--dim); background: var(--surface); border-top: 1px solid var(--border); }
      .emoji-toggle[disabled] { opacity: 0.35; }
      .chat-foot { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
      .chat-foot input { flex: 1; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 10px 15px; outline: none; min-width: 0; }
      .emoji-toggle { flex: none; background: none; border: 0; font-size: 20px; line-height: 1; padding: 0 2px; color: var(--dim); align-self: center; }
      .emoji-panel { display: grid; grid-template-columns: repeat(8, 1fr); max-height: 220px; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
      .emoji-cell { background: none; border: 0; font-size: 22px; line-height: 1.25; text-align: center; padding: 8px 0; }
      .conv-row {
        display: flex; gap: 11px; width: 100%; text-align: left; align-items: center;
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 13px 15px; margin-bottom: 10px; position: relative;
        box-shadow: var(--shadow);
      }
      .conv-row img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-alt); }
      .conv-row .mid { flex: 1; min-width: 0; }
      .conv-row .nm { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; }
      .conv-row .last { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .conv-row .when { color: var(--dim); font-size: 11px; flex: none; }
      .conv-row .unread {
        position: absolute; top: 10px; right: 12px; transform: translateY(16px);
        min-width: 18px; height: 18px; background: var(--accent-grad); color: #fff; border-radius: 999px;
        font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px;
      }

      /* ---------- mine ---------- */
      .panel:has(.profile-card) {
        background: var(--accent-grad); border-color: transparent; color: #fff;
        box-shadow: var(--btn-shadow);
      }
      .profile-card { display: flex; gap: 13px; align-items: center; }
      .profile-card .avatar {
        width: 56px; height: 56px; font-size: 22px;
        background: #ffffff; color: var(--price);
        box-shadow: 0 5px 14px rgba(120, 45, 0, 0.20);
      }
      .profile-card > div > div { color: rgba(255, 255, 255, 0.92) !important; }
      .profile-card > div > div:first-child { color: #ffffff !important; }
      .profile-card .link-btn { color: #ffffff; text-decoration: underline; text-underline-offset: 3px; }
      .profile-card .btn.ghost {
        background: rgba(255, 255, 255, 0.96); border-color: transparent; color: var(--price);
        box-shadow: 0 4px 10px rgba(120, 45, 0, 0.16);
      }
      .my-item {
        display: flex; gap: 11px; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 12px; margin-bottom: 10px; align-items: center;
        box-shadow: var(--shadow);
      }
      .my-item img { width: 62px; height: 62px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-alt); }
      .my-item .mid { flex: 1; min-width: 0; }
      .my-item .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .my-item .ops { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
      .op-btn { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 500; }
      .op-btn.warn { color: var(--danger); border-color: var(--danger); }
      .menu-row {
        display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 14px 15px; font-size: 15px; font-weight: 600; margin-top: 14px;
        box-shadow: var(--shadow);
      }
      .menu-row .arr { margin-left: auto; color: var(--dim); font-weight: 400; }

      /* ---------- school picker ---------- */
      .picker-search { position: sticky; top: 0; background: var(--bg); padding: 4px 16px 10px; z-index: 5; }
      .picker-search input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 11px 16px; outline: none; }
      .prov-chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 16px 10px; }

/* ================= 工具 ================= */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtTime(ts) {
  var d = Date.now() - ts;
  if (d < 60000) return "刚刚";
  if (d < 3600000) return Math.floor(d / 60000) + "分钟前";
  if (d < 86400000) return Math.floor(d / 3600000) + "小时前";
  if (d < 86400000 * 30) return Math.floor(d / 86400000) + "天前";
  var dt = new Date(ts);
  return (dt.getMonth() + 1) + "月" + dt.getDate() + "日";
}
function fmtPrice(n) { return Number(n).toLocaleString("zh-CN"); }
function toast(msg) {
  var old = $(".toast"); if (old) old.remove();
  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2400);
}
function netFail(what) { toast(what + "失败，请检查网络后重试"); }

/* ================= 注册 / 登录报错文案 ================= */
var USERNAME_RULE_MSG = "用户名要用 1–20 个字符，可以是中文、英文字母、数字、下划线和连字符，不能有空格";
var USERNAME_LONG_MSG = "用户名太长了，中文请控制在 10 个字以内";
var PASSWORD_RULE_MSG = "密码至少要 6 位";
var TAKEN_MSG = "这个用户名已经被注册了，换一个试试";
var NETWORK_MSG = "网络不可用，请检查网络后重试";
function isNetworkError(err) {
  if (!err) return false;
  if (err.network === true) return true;
  if (err.status === 0) return true;
  if (err instanceof TypeError) return true;
  return false;
}
/* 把服务器驳回的原因翻成明确提示；只有真的没连上才说是网络问题 */
function regErrorText(err) {
  if (!err) return "注册失败，请稍后重试";
  if (err.bmob && (err.bmob.code === 202 || err.bmob.code === 203)) return TAKEN_MSG;
  if (isNetworkError(err)) return NETWORK_MSG;
  return "注册失败，请稍后重试";
}
function loginErrorText(err) {
  if (err && isNetworkError(err)) return NETWORK_MSG;
  return "用户名或密码不正确";
}

var favRows = [];          /* [{itemId, at}] 按收藏时间倒序 */
var favsReady = false;
var viewRows = [];         /* [{itemId, at}] 按浏览时间倒序，最多 50 条 */
var viewsReady = false;

function profileFromUser(u) {
  return {
    id: u.objectId, username: u.username || "",
    display_name: u.displayName || "", school_code: u.schoolCode || "", school_name: u.schoolName || ""
  };
}
function mapItem(r) {
  return {
    id: String(r.objectId), sellerId: r.sellerId, sellerName: r.sellerName || "",
    title: r.title || "", price: Number(r.price) || 0,
    cat: r.category || "其他", cond: r.condition || "", loc: r.location || "",
    desc: r.description || "", img: r.image || "", school: r.schoolName || "",
    sold: !!r.sold, createdAt: toMs(r.createdAt) || Date.now()
  };
}
function mapWant(r) {
  return {
    id: String(r.objectId), buyerId: r.buyerId, buyerName: r.buyerName || "",
    title: r.title || "", budget: Number(r.budget) || 0,
    cat: r.category || "其他", school: r.schoolName || "",
    note: r.note || "", done: !!r.done,
    createdAt: toMs(r.createdAt) || Date.now()
  };
}
function mapComment(r, item) {
  return {
    id: String(r.objectId), who: r.authorName || "", authorId: r.authorId, text: r.content || "",
    isSeller: !!(item && r.authorId === item.sellerId),
    createdAt: toMs(r.createdAt) || Date.now()
  };
}
function mapMsg(r) {
  return {
    id: String(r.objectId), from: r.senderId, text: r.content || "", type: r.msgType || "text",
    at: toMs(r.createdAt) || Date.now(), read: !!(r.readAt && Number(r.readAt) > 0)
  };
}
function mapConv(r, msgs) {
  msgs = msgs || [];
  return {
    id: String(r.objectId), itemId: String(r.itemId), buyerId: r.buyerId, sellerId: r.sellerId, msgs: msgs,
    itemTitle: r.itemTitle || "", itemPrice: r.itemPrice, itemImage: r.itemImage || "",
    updatedAt: r.lastAt ? Number(r.lastAt) : (toMs(r.createdAt) || Date.now())
  };
}
function me() {
  if (!profile) return null;
  return { id: profile.id, username: profile.username, nickname: profile.display_name || profile.username, school: profile.school_name || "" };
}
function sameId(a, b) { return a != null && b != null && String(a) === String(b); }
function itemById(id) { for (var i = 0; i < itemsCache.length; i++) if (sameId(itemsCache[i].id, id)) return itemsCache[i]; return null; }
function convById(id) { for (var i = 0; i < convsCache.length; i++) if (sameId(convsCache[i].id, id)) return convsCache[i]; return null; }
function wantById(id) { for (var i = 0; i < wantsCache.length; i++) if (sameId(wantsCache[i].id, id)) return wantsCache[i]; return null; }
function isMine(item) { var m = me(); return !!(m && item.sellerId === m.id); }
function isMyWant(w) { var m = me(); return !!(m && w && w.buyerId === m.id); }
/* ================= 数据加载 ================= */
function loadItems() {
  if (!dbReady) { itemsErr = "网络组件加载失败，请刷新页面重试。"; itemsReady = true; render(); return Promise.resolve(); }
  return bReq("GET", "classes/items", { order: "-createdAt", limit: "1000" }).then(function (r) {
    itemsErr = ""; itemsCache = (r.results || []).map(mapItem);
    itemsReady = true; render();
  }, function (e) {
    if (bIsCode(e, 101)) { itemsErr = ""; itemsCache = []; }
    else { itemsErr = "商品加载失败，请检查网络后重试。"; }
    itemsReady = true; render();
  });
}
function loadWants() {
  if (!dbReady) { wantsErr = "网络组件加载失败，请刷新页面重试。"; wantsReady = true; render(); return; }
  return bReq("GET", "classes/wants", { order: "-createdAt", limit: "1000" }).then(function (r) {
    wantsErr = ""; wantsCache = (r.results || []).map(mapWant);
    wantsReady = true; render();
  }, function (e) {
    if (bIsCode(e, 101)) { wantsErr = ""; wantsCache = []; }
    else { wantsErr = "求购加载失败，请检查网络后重试。"; }
    wantsReady = true; render();
  });
}
function loadProfile(userId) {
  return bReq("GET", "users/" + userId).then(function (u) {
    if (u && u.objectId) { profile = profileFromUser(u); profilesCache[profile.id] = profile; }
    return profile;
  }, function () { return profile; });
}
function loadConvs() {
  var m = me();
  if (!m || !dbReady) { convsCache = []; convsReady = true; return Promise.resolve(); }
  convsReady = false;
  var where = { "$or": [{ buyerId: m.id }, { sellerId: m.id }] };
  return bReq("GET", "classes/conversations", { where: where, order: "-createdAt", limit: "1000" }).then(function (r) {
    var rows = r.results || [];
    var ids = rows.map(function (c) { return c.objectId; });
    var others = {};
    rows.forEach(function (c) { others[c.buyerId === m.id ? c.sellerId : c.buyerId] = 1; });
    var otherIds = Object.keys(others).filter(function (id) { return !profilesCache[id]; });
    var msgQ = ids.length ? bQuery("messages", { conversationId: { "$in": ids } }, { order: "createdAt" }) : Promise.resolve([]);
    var profQ = Promise.all(otherIds.map(function (id) {
      return bReq("GET", "users/" + id).then(function (u) {
        if (u && u.objectId) profilesCache[u.objectId] = profileFromUser(u);
      }, function () {});
    }));
    return Promise.all([msgQ, profQ]).then(function (rr) {
      var byConv = {};
      (rr[0] || []).forEach(function (msg) { (byConv[msg.conversationId] = byConv[msg.conversationId] || []).push(mapMsg(msg)); });
      convsCache = rows.map(function (c) { return mapConv(c, byConv[c.objectId] || []); });
      convsReady = true; render();
    });
  }, function () { convsReady = true; render(); });
}
function loadComments(itemId) {
  if (!dbReady) return;
  commentsLoading = itemId;
  bQuery("comments", { itemId: String(itemId) }, { order: "createdAt" }).then(function (rows) {
    var it = itemById(itemId);
    commentsCache[itemId] = rows.map(function (r) { return mapComment(r, it); });
    if (commentsLoading === itemId) commentsLoading = null;
    renderLayer();
  }, function () {
    if (commentsLoading === itemId) commentsLoading = null;
    renderLayer();
  });
}

/* ================= 收藏 / 浏览记录 ================= */
function isFav(id) { return !!favSet[String(id)]; }
function heartIcon(on) {
  return '<svg width="17" height="17" viewBox="0 0 24 24" fill="' + (on ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.6C6.9 16.6 3 13.2 3 9.2 3 6.3 5.2 4.3 7.8 4.3c1.7 0 3.3 1 4.2 2.5.9-1.5 2.5-2.5 4.2-2.5 2.6 0 4.8 2 4.8 4.9 0 4-3.9 7.4-9 11.4z"/></svg>';
}
function loadFavs() {
  var m = me();
  if (!m || !dbReady) { favSet = {}; favRows = []; favsReady = true; return Promise.resolve(); }
  return bQuery("favorites", { userId: m.id }, { order: "-createdAt" }).then(function (rows) {
    favRows = rows.map(function (r) { return { itemId: String(r.itemId), at: toMs(r.createdAt) || Date.now() }; });
    favSet = {};
    favRows.forEach(function (r) { favSet[r.itemId] = true; });
    favsReady = true; render();
  }, function () { favsReady = true; render(); });
}
function loadViews() {
  var m = me();
  if (!m || !dbReady) { viewRows = []; viewsReady = true; return Promise.resolve(); }
  return bQuery("views", { userId: m.id }, { order: "-viewedAt", limit: 50 }).then(function (rows) {
    viewRows = rows.map(function (r) { return { itemId: String(r.itemId), at: r.viewedAt ? Number(r.viewedAt) : Date.now() }; });
    viewsReady = true; render();
  }, function () { viewsReady = true; render(); });
}
function recordView(itemId) {
  var m = me(); if (!m || !dbReady) return;
  var iid = String(itemId);
  bQuery("views", { userId: m.id, itemId: iid }, { limit: 1 }).then(function (rows) {
    if (rows.length) return bReq("PUT", "classes/views/" + rows[0].objectId, { viewedAt: Date.now() });
    return bReq("POST", "classes/views", { userId: m.id, itemId: iid, viewedAt: Date.now(), ACL: aclOnly(m.id) });
  }).then(function () {}, function (e) { console.error(e); });
  viewRows = viewRows.filter(function (r) { return !sameId(r.itemId, itemId); });
  viewRows.unshift({ itemId: String(itemId), at: Date.now() });
  if (viewRows.length > 50) viewRows = viewRows.slice(0, 50);
  viewsReady = true;
}
function toggleFav(item) {
  var m = me(); if (!requireLogin()) return;
  if (!dbReady) { netFail("收藏"); return; }
  var id = String(item.id);
  bQuery("favorites", { userId: m.id, itemId: id }, { limit: 1 }).then(function (rows) {
    if (rows.length) {
      return bReq("DELETE", "classes/favorites/" + rows[0].objectId).then(function () {
        delete favSet[id];
        favRows = favRows.filter(function (r) { return !sameId(r.itemId, id); });
        render(); toast("已取消收藏");
      }, function () { netFail("取消收藏"); });
    }
    return bReq("POST", "classes/favorites", { userId: m.id, itemId: id, ACL: aclOnly(m.id) }).then(function () {
      favSet[id] = true;
      favRows.unshift({ itemId: id, at: Date.now() });
      render(); toast("已收藏");
    }, function () { netFail("收藏"); });
  }, function () { netFail(isFav(id) ? "取消收藏" : "收藏"); });
}
function loadConvMsgs(conv) {
  if (!dbReady) return Promise.resolve();
  return bQuery("messages", { conversationId: String(conv.id) }, { order: "createdAt" }).then(function (rows) {
    conv.msgs = rows.map(mapMsg);
    if (conv.msgs.length) conv.updatedAt = conv.msgs[conv.msgs.length - 1].at;
  }, function () {});
}
function markRead(conv) {
  var m = me(); if (!m || !dbReady) return;
  var changed = false;
  var unreadIds = [];
  conv.msgs.forEach(function (x) { if (x.from !== m.id && !x.read) { x.read = true; changed = true; unreadIds.push(x.id); } });
  if (changed) {
    var nowStr = String(Date.now());
    bBatch(unreadIds.map(function (id) {
      return { method: "PUT", path: "/1/classes/messages/" + id, body: { readAt: nowStr } };
    }));
    render();
  }
}
function convOtherName(conv) {
  var m = me(); if (!m) return "";
  if (conv.buyerId === m.id) {
    var it = itemById(conv.itemId);
    if (it && it.sellerName) return it.sellerName;
    var p = profilesCache[conv.sellerId];
    return p ? (p.display_name || p.username) : "卖家";
  }
  var pb = profilesCache[conv.buyerId];
  return pb ? (pb.display_name || pb.username) : "买家";
}
function convUnread(conv) {
  var m = me(); if (!m) return 0;
  return conv.msgs.filter(function (x) { return x.from !== m.id && !x.read; }).length;
}

function unreadTotal() {
  var m = me(); if (!m) return 0;
  var n = 0;
  convsCache.forEach(function (c) { n += convUnread(c); });
  return n;
}

function render() {
  var app = $("#app");
  var html = '<div class="wrap">';
  if (ui.tab === "market") html += viewMarket();
  else if (ui.tab === "wants") html += viewWants();
  else if (ui.tab === "publish") html += viewPublish();
  else if (ui.tab === "messages") html += viewMessages();
  else html += viewMine();
  html += "</div>";
  html += tabbarHtml();
  app.innerHTML = html;
  renderLayer();
}

function tabbarHtml() {
  var un = unreadTotal();
  function tab(key, icon, label, extraCls) {
    return '<button class="tab' + (ui.tab === key ? " active" : "") + (extraCls ? " " + extraCls : "") + '" data-act="tab" data-tab="' + key + '"><span class="ic">' + icon + "</span><span>" + label + "</span>" +
      (key === "messages" && un > 0 ? '<span class="dot">' + (un > 99 ? "99+" : un) + "</span>" : "") + "</button>";
  }
  return '<nav class="tabbar"><div class="tabbar-in">' +
    tab("market", ICONS.home, "市场") + tab("wants", ICONS.want, "求购") + tab("publish", ICONS.plusBig, "发布", "pub") +
    tab("messages", ICONS.chat, "消息") + tab("mine", ICONS.user, "我的") + "</div></nav>";
}

function filteredItems() {
  var list = itemsCache.slice();
  if (ui.school) list = list.filter(function (i) { return i.school === ui.school; });
  if (ui.cat !== "全部") list = list.filter(function (i) { return i.cat === ui.cat; });
  if (ui.q) {
    var q = ui.q.toLowerCase();
    list = list.filter(function (i) { return (i.title + " " + i.desc + " " + i.school + " " + i.cat).toLowerCase().indexOf(q) >= 0; });
  }
  list.sort(function (a, b) {
    if (a.sold !== b.sold) return a.sold ? 1 : -1;
    if (ui.sort === "low") return a.price - b.price;
    if (ui.sort === "high") return b.price - a.price;
    return b.createdAt - a.createdAt;
  });
  return list;
}

/* ================= 求购（买家需求） ================= */
function filteredWants() {

/* 有闲置的同学点「联系 TA」：以求购为主题开一条私聊（求购人是买家，联系人是卖家） */
function startWantChat(w) {
  var m = me(); if (!requireLogin()) return;
  if (!dbReady) { netFail("打开私聊"); return; }
  if (w.buyerId === m.id || w.done) return;
  var key = "want:" + w.id;
  var existing = null;
  convsCache.forEach(function (c) { if (c.itemId === key && c.buyerId === w.buyerId && c.sellerId === m.id) existing = c; });
  if (existing) { openConv(existing); return; }
  bQuery("conversations", { itemId: key, buyerId: w.buyerId, sellerId: m.id }, { limit: 1 }).then(function (rows) {
    if (rows.length) {
      var c0 = mapConv(rows[0], []);
      convsCache.push(c0); openConv(c0); return;
    }
    var body = {
      itemId: key, itemTitle: "求购：" + w.title, itemPrice: w.budget, itemImage: "",
      buyerId: w.buyerId, buyerName: w.buyerName, sellerId: m.id, sellerName: m.nickname,
      lastMsg: "", lastAt: Date.now(),
      ACL: aclOnly(m.id, w.buyerId)
    };
    bReq("POST", "classes/conversations", body).then(function (r) {
      var row = {};
      Object.keys(body).forEach(function (k) { if (k !== "ACL") row[k] = body[k]; });
      row.objectId = r.objectId; row.createdAt = r.createdAt;
      var c1 = mapConv(row, []);
      convsCache.push(c1); openConv(c1);
    }, function () { netFail("打开私聊"); });
  }, function () { netFail("打开私聊"); });
}

/* 网页端发消息后静默给对方推一条订阅消息提醒：全程失败不提示、不影响发消息主流程 */
function notifyPeerFromWeb(conv, content, msgType) {
  try {
    var m = me(); if (!m) return;
    var peerId = (conv.buyerId === m.id ? conv.sellerId : conv.buyerId);
    if (!peerId || peerId === m.id) return;
    var now = Date.now();
    var throttle = {};
    try { throttle = JSON.parse(localStorage.getItem("notifyThrottle") || "{}") || {}; } catch (e1) { throttle = {}; }
    if (throttle[conv.id] && now - Number(throttle[conv.id]) < 10 * 60 * 1000) return;
    throttle[conv.id] = now;
    try { localStorage.setItem("notifyThrottle", JSON.stringify(throttle)); } catch (e2) {}
    var unread = 0;
    (conv.msgs || []).forEach(function (msg) { if (msg.from === m.id && !msg.read) unread++; });
    if (unread < 1) unread = 1;
    var preview = msgType === "image" ? "[图片]" : msgType === "video" ? "[视频]" : String(content).slice(0, 20);
    bReq("GET", "users/" + peerId).then(function (u) {
      try {
        var openid = u && u.openid;
        if (!openid) return;
        fetch("https://1517877183-f4zemgmyok.ap-chengdu.tencentscf.com/notify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ openid: openid, senderName: m.nickname, preview: preview, unread: unread })
        }).then(function () {}, function () {});
      } catch (e3) {}
    }, function () {});
  } catch (e) {}
}

/* 聊天图片压缩：长边压到 ≤1080 输出 JPEG，质量从 0.85 起，Blob 超过 1MB 时逐档降到 0.6 / 0.45 */
function compressChatImage(file) {
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1080, w = img.width, h = img.height;
      if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
      var cv = document.createElement("canvas");
      cv.width = Math.max(1, w); cv.height = Math.max(1, h);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      var QUALS = [0.85, 0.6, 0.45];
      function attempt(i, prev) {
        if (i >= QUALS.length) { resolve(prev); return; }
        try {
          cv.toBlob(function (b) {
            if (!b) { resolve(prev); return; }
            if (b.size <= 1024 * 1024 || i === QUALS.length - 1) resolve(b);
            else attempt(i + 1, b);

        ui.pubImg = out;
        ui.pubBlob = null;
        var blobGuard = ui.pubImg;
        makeCosBlob(img).then(function (blob) {
          /* 期间用户又选了新图/删图/切走则丢弃这次结果，避免旧 Blob 覆盖新状态 */
          if (blob && ui.pubImg === blobGuard && ui.pubImg !== "__none__") ui.pubBlob = blob;
        });
        render();
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  }
});
document.addEventListener("submit", function (e) {
  e.preventDefault();
  var m = me();
  if (e.target.id === "login-form") {
    if (!dbReady) { ui.loginErr = "网络组件加载失败，请刷新页面重试。"; render(); return; }

    var u = $("#l-user").value.trim(), pw = $("#l-pw").value;
    if (!u || !pw) { ui.loginErr = "用户名和密码都要填。"; render(); return; }
    ui.authBusy = true; ui.loginErr = ""; render();
    bLogin(u, pw).then(function (userId) {
      ui.authBusy = false;
      afterLogin(userId, "登录成功，欢迎回来");
    }, function (err) {
      ui.authBusy = false;
      ui.loginErr = loginErrorText(err);
      render();
    });
  }
  if (e.target.id === "reg-form") {
    if (!dbReady) { ui.regErr = "网络组件加载失败，请刷新页面重试。"; render(); return; }
    if (ui.authBusy) return;
    var ru = $("#r-user").value.trim(), rpw = $("#r-pw").value, nick = $("#r-nick").value.trim();
    ui.draft = { "r-user": ru, "r-pw": rpw, "r-nick": nick };
    if (!/^[A-Za-z0-9\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff_-]{1,20}$/.test(ru)) { ui.regErr = USERNAME_RULE_MSG; render(); return; }
    /* 含中文的用户名在服务端标识会膨胀，超过约 10 个中文字先拦下（文案与拦截规则保持原样） */
    if (/[^\x00-\x7f]/.test(ru)) {
      var ruEsc = unescape(encodeURIComponent(ru.toLowerCase()));
      if (1 + 2 * ruEsc.length > 64) { ui.regErr = USERNAME_LONG_MSG; render(); return; }
    }
    if (rpw.length < 6) { ui.regErr = PASSWORD_RULE_MSG; render(); return; }
    if (!nick) { ui.regErr = "给自己起个昵称吧。"; render(); return; }
    ui.authBusy = true; ui.regErr = ""; render();
    var regBody = {
      username: ru, password: rpw, usernameLower: ru.toLowerCase(),
      displayName: nick, schoolCode: ui.regSchool || "", schoolName: ui.regSchool || ""
    };
    bReq("POST", "users", regBody, { auth: false }).then(function (r) {
      ui.authBusy = false;
      session = { token: r.sessionToken, userId: r.objectId };
      saveSession();
      var merged = {};
      Object.keys(regBody).forEach(function (k) { if (k !== "password") merged[k] = regBody[k]; });
      merged.objectId = r.objectId;
      profile = profileFromUser(merged); profilesCache[profile.id] = profile;
      ui.regSchool = ""; ui.draft = null; ui.regErr = "";
      ui.tab = "market";
      loadItems(); loadWants(); loadConvs(); loadFavs(); loadViews();
      render(); toast("注册成功，已经登录");
    }, function (err) {
      ui.authBusy = false;
      ui.regErr = regErrorText(err);
      render();
    });
  }
  if (e.target.id === "pub-form") {
    if (!m || !dbReady || ui.pubBusy) return;
    ui.draft = {};
    ["f-title", "f-price", "f-cat", "f-cond", "f-loc", "f-desc"].forEach(function (fid) { var n = document.getElementById(fid); if (n) ui.draft[fid] = n.value; });
    var title = $("#f-title").value.trim();
    var price = parseFloat($("#f-price").value);
    var school = ui.pubSchool || (ui.editingId && itemById(ui.editingId) ? itemById(ui.editingId).school : m.school || "");
    if (!title) { ui.pubErr = "标题还没填。"; render(); return; }
    if (!(price >= 0)) { ui.pubErr = "价格填一个数字，免费送就填 0。"; render(); return; }
    if (!school) { ui.pubErr = "选一下学校，同学按学校找闲置最方便。"; render(); return; }
    var fields = {
      title: title, price: Math.round(price),
      category: $("#f-cat").value, condition: $("#f-cond").value,
      location: $("#f-loc").value.trim() || "校内面交", description: $("#f-desc").value.trim(),
      schoolCode: school, schoolName: school
    };
    var edItem = ui.editingId ? itemById(ui.editingId) : null;
    /* 本次新选了图时先异步解析图片地址（优先 COS 直传，失败回退 base64），再走原提交流程；
       删图/编辑未换图/新建未选图不调签名服务，fields.image 取值与原来完全一致 */
    ui.pubBusy = true; ui.pubErr = ""; render();
    var submitWithImage = function (imageUrl) {
      if (ui.pubImg === "__none__") fields.image = "";
      else if (imageUrl) fields.image = imageUrl;
      else if (ui.pubImg) fields.image = ui.pubImg;
      else if (edItem) fields.image = edItem.img || "";
      else fields.image = "";
    if (edItem) {
      if (edItem.sellerId !== m.id) { ui.pubBusy = false; return; }
      bReq("PUT", "classes/items/" + edItem.id, fields).then(function () {
        ui.pubBusy = false;
        var idx = itemsCache.indexOf(edItem);
        if (idx >= 0) {
          var rawRow = {
            objectId: edItem.id, sellerId: edItem.sellerId, sellerName: edItem.sellerName,
            title: fields.title, price: fields.price, category: fields.category, condition: fields.condition,
            location: fields.location, description: fields.description, image: fields.image,
            schoolCode: fields.schoolCode, schoolName: fields.schoolName,
            sold: edItem.sold, createdAt: edItem.createdAt
          };
          itemsCache[idx] = mapItem(rawRow);
        }
        ui.editingId = null; ui.pubImg = ""; ui.pubBlob = null; ui.pubSchool = ""; ui.draft = null; ui.tab = "mine";
        render(); toast("已保存修改");
      }, function () {
        ui.pubBusy = false;
        ui.pubErr = "保存失败，请检查网络后重试。"; render();
      });
    } else {
      fields.sellerId = m.id; fields.sellerName = m.nickname; fields.sold = false;
      fields.ACL = aclPublicRead(m.id);
      bReq("POST", "classes/items", fields).then(function (r) {
        ui.pubBusy = false;
        var row = {};
        Object.keys(fields).forEach(function (k) { if (k !== "ACL") row[k] = fields[k]; });
        row.objectId = r.objectId; row.createdAt = r.createdAt;
        itemsCache.unshift(mapItem(row));
        ui.pubImg = ""; ui.pubBlob = null; ui.pubSchool = ""; ui.draft = null; ui.tab = "market"; ui.cat = "全部"; ui.school = ""; ui.q = "";
        render(); toast("发布成功，已经在市场里了");
      }, function () {
        ui.pubBusy = false;
        ui.pubErr = "发布失败，请检查网络后重试。"; render();
      });
    }
    };
    var hasNewImg = ui.pubImg !== "__none__" && ui.pubImg !== "" && !!ui.pubBlob;
    if (hasNewImg) {
      resolveCosImageUrl(ui.pubBlob).then(function (url) { submitWithImage(url); });
    } else {
      submitWithImage(null);
    }
  }
  if (e.target.id === "want-form") {
    if (!m || !dbReady || ui.wantBusy) return;
    ui.draft = {};
    ["w-title", "w-budget", "w-cat", "w-note"].forEach(function (fid) { var n = document.getElementById(fid); if (n) ui.draft[fid] = n.value; });
    var wtitle = $("#w-title").value.trim();
    var wbudgetRaw = $("#w-budget").value.trim();
    var wbudget = wbudgetRaw === "" ? 0 : parseFloat(wbudgetRaw);
    var edWant = ui.editingWantId ? wantById(ui.editingWantId) : null;
    var wschool = ui.wantSchool2 || (edWant ? edWant.school : m.school || "");
    if (!wtitle) { ui.wantErr = "先写下想买什么。"; render(); return; }
    if (wbudgetRaw !== "" && !(wbudget >= 0)) { ui.wantErr = "预算填一个数字，或者留空表示面议。"; render(); return; }
    if (!wschool) { ui.wantErr = "选一下学校，同学按学校找求购最方便。"; render(); return; }
    var wfields = {
      title: wtitle, budget: Math.round(wbudget || 0),
      category: $("#w-cat").value, note: $("#w-note").value.trim(),
      schoolCode: wschool, schoolName: wschool
    };
    ui.wantBusy = true; ui.wantErr = ""; render();
    if (edWant) {
      if (edWant.buyerId !== m.id) { ui.wantBusy = false; return; }
      bReq("PUT", "classes/wants/" + edWant.id, wfields).then(function () {
        ui.wantBusy = false;
        var widx = wantsCache.indexOf(edWant);
        if (widx >= 0) {
          wantsCache[widx] = mapWant({
            objectId: edWant.id, buyerId: edWant.buyerId, buyerName: edWant.buyerName,
            title: wfields.title, budget: wfields.budget, category: wfields.category,
            schoolName: wfields.schoolName, note: wfields.note, done: edWant.done,
            createdAt: edWant.createdAt
          });
        }
        ui.editingWantId = null; ui.wantSchool2 = ""; ui.draft = null; ui.wantMode = "list";
        render(); toast("求购已更新");
      }, function () {
        ui.wantBusy = false;
        ui.wantErr = "保存失败，请检查网络后重试。"; render();
      });
    } else {
      wfields.buyerId = m.id; wfields.buyerName = m.nickname; wfields.done = false;
      wfields.ACL = aclPublicRead(m.id);
      bReq("POST", "classes/wants", wfields).then(function (r) {
        ui.wantBusy = false;
        var wrow = {};
        Object.keys(wfields).forEach(function (k) { if (k !== "ACL") wrow[k] = wfields[k]; });
        wrow.objectId = r.objectId; wrow.createdAt = r.createdAt;
        wantsCache.unshift(mapWant(wrow));
        ui.wantSchool2 = ""; ui.draft = null; ui.wantMode = "list";
        ui.wantQ = ""; ui.wantCat = "全部"; ui.wantSchool = "";
        render(); toast("求购发布成功，有闲置的同学会来联系你");
      }, function () {
        ui.wantBusy = false;
        ui.wantErr = "发布失败，请检查网络后重试。"; render();
      });
    }
  }
  if (e.target.id === "fb-form") {
    var fbContent = $("#fb-content").value.trim();
    var fbContact = $("#fb-contact").value.trim();
    if (!fbContent) { toast("先写下反馈内容再提交"); return; }
    if (!m) { ui.feedback = false; requireLogin(); return; }
    if (ui.fbBusy) return;
    if (!dbReady) { toast("提交失败，请检查网络后重试"); return; }
    ui.fbBusy = true;
    var fbBtn = $("#fb-submit"); if (fbBtn) { fbBtn.disabled = true; fbBtn.textContent = "正在提交…"; }
    var fbBody = { authorId: m.id, authorName: m.nickname, content: fbContent, contact: fbContact, ACL: aclOnly(m.id) };
    bReq("POST", "classes/feedbacks", fbBody).then(function () {
      ui.fbBusy = false; ui.feedback = false; ui.fbDraft = null;
      renderLayer();
      /* 邮件通知走已有云函数：这一步失败完全静默，不影响提交结果 */
      try {
        fetch("https://1517877183-f4zemgmyok.ap-chengdu.tencentscf.com/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: fbContent, contact: fbContact, fromName: m.nickname, fromUsername: m.username })
        }).then(function () {}, function () {});
      } catch (e3) {}
      toast("提交成功，谢谢反馈");
    }, function (err) {
      ui.fbBusy = false;
      var fbBtn2 = $("#fb-submit"); if (fbBtn2) { fbBtn2.disabled = false; fbBtn2.textContent = "提交"; }
      toast("提交失败：" + (err && err.message ? err.message : "请稍后重试"));
    });
  }
  if (e.target.id === "comment-form") {
    if (!m || !dbReady) return;
    var tx = $("#comment-text").value.trim(); if (!tx) return;
    var iid = ui.detailId; if (!iid) return;
    var input = $("#comment-text"); input.disabled = true;
    var cBody = { itemId: String(iid), authorId: m.id, authorName: m.nickname, content: tx, ACL: aclPublicRead(m.id) };
    bReq("POST", "classes/comments", cBody).then(function (r) {
      var it = itemById(iid);
      if (!commentsCache[iid]) commentsCache[iid] = [];
      var row = { objectId: r.objectId, createdAt: r.createdAt, itemId: String(iid), authorId: m.id, authorName: m.nickname, content: tx };
      commentsCache[iid].push(mapComment(row, it));
      renderLayer();
      notifyItemOwner(it, tx);
    }, function () { netFail("发送留言"); var inp2 = $("#comment-text"); if (inp2) inp2.disabled = false; });
  }
  if (e.target.id === "chat-form") {
    var conv = convById(ui.chatId); if (!conv) return;
    var t = $("#chat-text").value.trim(); if (!t) return;
    sendChat(conv, t);
  }
});

/* ================= 启动 ================= */
render();
if (!dbReady) {
  itemsErr = "网络组件加载失败，请检查网络后刷新页面重试。";
  itemsReady = true; convsReady = true;
  render();
} else {
  var savedSession = loadSavedSession();
  if (savedSession) {
    session = savedSession;
    bReq("GET", "users/" + savedSession.userId).then(function (u) {
      if (u && u.objectId) {
        profile = profileFromUser(u);
        profilesCache[profile.id] = profile;
        /* 令牌活性探针：同一账号在小程序登录后，Bmob 会降级网页版保存的旧令牌——
           GET 资料照常成功，但带 ACL 的表（conversations/messages/favorites/views）
           查询会静默返回空。空体 PUT users/{id} 验令牌健康：健康返回 200，
           被降级返回 bmob code 206。 */
        bReq("PUT", "users/" + savedSession.userId, {}).then(function () {
          loadItems(); loadWants(); loadConvs(); loadFavs(); loadViews();
        }, function (err) {
          if (bIsCode(err, 206) || bIsCode(err, 209) || bIsCode(err, 401) || (err && err.status === 401)) {
            /* 令牌已降级：清掉会话按未登录启动，明确提示重新登录（不要静默按已登录加载私聊/收藏） */
            clearSessionLocal();
            profile = null;
            ui.loginErr = "登录状态已失效：同一账号在小程序登录过后，网页版需要重新登录一次，聊天记录就会回来。";
            loadItems(); loadWants();
            render();
            toast("登录状态已失效：同一账号在小程序登录过后，网页版需要重新登录一次，聊天记录就会回来。");
          } else {
            /* 网络异常等其他失败：不清会话，照常按已登录加载（离线不应把用户登出） */
            loadItems(); loadWants(); loadConvs(); loadFavs(); loadViews();
          }
        });
      } else {
        clearSessionLocal();
        loadItems(); loadWants();
      }
    }, function () {
      /* 会话已失效（209/401 等）：清掉会话，按未登录启动 */
      clearSessionLocal();
      loadItems(); loadWants();
    });
  } else {
    loadItems(); loadWants();
  }
}
